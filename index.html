<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untuk Kamu 🤍</title>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#ffd6e0,#fff0f5,#ffeaea);
      font-family:'Poppins',sans-serif;
      position:relative;
    }

    /* FLOATING LOVE */
    .love{
      position:absolute;
      color:white;
      font-size:22px;
      animation:float 8s linear infinite;
      opacity:0.7;
    }

    @keyframes float{
      0%{
        transform:translateY(100vh) scale(1);
        opacity:0;
      }
      20%{
        opacity:0.8;
      }
      100%{
        transform:translateY(-120vh) scale(1.5);
        opacity:0;
      }
    }

    /* CARD */
    .card{
      width:90%;
      max-width:520px;
      padding:40px 30px;
      border-radius:30px;
      background:rgba(255,255,255,0.25);
      backdrop-filter:blur(15px);
      border:1px solid rgba(255,255,255,0.3);
      box-shadow:0 10px 40px rgba(0,0,0,0.15);
      text-align:center;
      position:relative;
      z-index:2;
      animation:muncul 1.5s ease;
    }

    .heart{
      font-size:75px;
      animation:beat 1s infinite;
    }

    h1{
      font-family:'Sacramento',cursive;
      font-size:58px;
      color:#ff4f7b;
      margin-top:10px;
    }

    .typing{
      margin-top:20px;
      color:#555;
      line-height:2;
      font-size:16px;
      font-weight:300;
      min-height:220px;
      white-space:pre-line;
    }

    .btn{
      display:inline-block;
      margin-top:25px;
      padding:14px 35px;
      border:none;
      border-radius:40px;
      background:linear-gradient(135deg,#ff4f7b,#ff7aa2);
      color:white;
      font-weight:600;
      font-size:16px;
      cursor:pointer;
      transition:0.4s;
      box-shadow:0 5px 20px rgba(255,79,123,0.4);
    }

    .btn:hover{
      transform:scale(1.07);
      box-shadow:0 10px 25px rgba(255,79,123,0.5);
    }

    /* POPUP */
    .popup{
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%) scale(0);
      background:white;
      padding:35px;
      border-radius:25px;
      box-shadow:0 10px 40px rgba(0,0,0,0.2);
      text-align:center;
      z-index:10;
      transition:0.5s;
      width:85%;
      max-width:350px;
    }

    .popup.show{
      transform:translate(-50%,-50%) scale(1);
    }

    .popup h2{
      color:#ff4f7b;
      margin-bottom:10px;
      font-size:38px;
      font-family:'Sacramento',cursive;
    }

    .popup p{
      color:#555;
      line-height:1.8;
      font-size:15px;
    }

    /* BUTTON MAAFIN */
    .maafin-btn{
      margin-top:20px;
      padding:12px 28px;
      border:none;
      border-radius:30px;
      background:linear-gradient(135deg,#ff4f7b,#ff7aa2);
      color:white;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
      box-shadow:0 5px 20px rgba(255,79,123,0.4);
    }

    .maafin-btn:hover{
      transform:scale(1.08);
    }

    /* ANIMATION */
    @keyframes beat{
      0%,100%{
        transform:scale(1);
      }
      50%{
        transform:scale(1.2);
      }
    }

    @keyframes muncul{
      from{
        opacity:0;
        transform:translateY(30px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    /* RESPONSIVE */
    @media(max-width:600px){

      h1{
        font-size:48px;
      }

      .typing{
        font-size:15px;
      }

    }

  </style>
</head>
<body>

  <!-- LOVE FLOAT -->
  <div class="love" style="left:10%; animation-delay:0s;">❤</div>
  <div class="love" style="left:25%; animation-delay:2s;">❤</div>
  <div class="love" style="left:40%; animation-delay:4s;">❤</div>
  <div class="love" style="left:55%; animation-delay:1s;">❤</div>
  <div class="love" style="left:75%; animation-delay:5s;">❤</div>
  <div class="love" style="left:90%; animation-delay:3s;">❤</div>

  <!-- CARD -->
  <div class="card">

    <div class="heart">🤍</div>

    <h1>Untuk Kamu maudiii faaaliiriiaa</h1>

    <div class="typing" id="typing"></div>

    <button class="btn" onclick="showPopup()">
      klik yaaa sayangggg 🤍
    </button>

  </div>

  <!-- POPUP -->
  <div class="popup" id="popup">

    <h2>Maafin Aku Ya? 🤍</h2>

    <p>
      Aku janji bakal lebih ngerti kamu,
      lebih perhatian,
      dan ga ngulangin kesalahan yang sama lagi ❤️
    </p>

    <button class="maafin-btn" onclick="maafinAku()">
      Iya Aku Maafin 🤍
    </button>

  </div>

  <script>

    // TYPING EFFECT
    const text = `
Aku tau aku banyak salah sama kamu...

Aku terlalu sibuk sama dunia aku sendiri sampai lupa ada hati kamu yang harus dijaga.

Jujur aku ga mau kehilangan kamu.

Kalau kamu masih kecewa, aku ngerti.
aku minta sama kamu jangan ngudahin hubungan ini sayaang,beri aku hukuman saja,jangan kamu yang pergi eummm

Karena buat aku,
kamu rumah paling nyaman 🤍
`;

    let i = 0;

    function ketik(){

      if(i < text.length){

        document.getElementById("typing").innerHTML += text.charAt(i);

        i++;

        setTimeout(ketik, 40);

      }

    }

    ketik();

    // SHOW POPUP
    function showPopup(){

      document.getElementById("popup").classList.add("show");

    }

    // BUTTON MAAFIN
    function maafinAku(){

      document.getElementById("popup").innerHTML = `
      
        <h2>Yeeey 🤍</h2>

        <p>
          Makasih udah maafin aku sayang ❤️ <br><br>

          Aku bakal jaga kamu lebih baik lagi,
          lebih ngerti kamu,
          dan lebih sayang sama kamu ✨
        </p>

      `;

    }

  </script>

</body>
</html>
